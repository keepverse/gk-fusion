name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release is a declared CI superset, not a second hand-maintained partial test list. This
  # reusable call executes every gate in ci.yml at the tag's exact checked-out commit.
  ci-superset:
    name: CI superset — native/content/web/E2E/Server/importer/guards
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: ci-superset
    runs-on: windows-latest
    # ci.yml's own 2026-09-06 fix, same reason: a real, reproduced .NET process-redirection deadlock
    # (CreatureSpeciesImportCliTests.cs/RealColdProcessTests.cs) can hang a dotnet test call with no
    # diagnostic — bound the job so a future hang fails fast instead of idling toward GitHub Actions'
    # own 6-hour default.
    timeout-minutes: 60
    # THIS REPOSITORY IS CHECKED OUT INTO `gk-fusion/`, NOT AT THE WORKSPACE ROOT, and every
    # sibling it needs is checked out BESIDE it. That is not a layout preference: it is the layout
    # gk-core/ci.yml and gk-web/ci.yml already use, and it is what makes a reference resolvable at
    # all. Nine lines of this job named a path in gk-core and gk-workflow while the job declared two
    # checkouts, so the job died at the first of them and no release could publish. The fix is not
    # nine repointed paths — it is the set of checkouts those paths resolve against.
    #
    # The set is measured, not guessed. Of the 35 guards in gk-core's enforcement registry, 31
    # resolve in gk-core or gk-fusion, 3 live in gk-workflow (`check-decision-citations.py`,
    # `session-boundary-check.py`, `audit-doc-citations.py`) and 1 in gk-forge
    # (`guard-seedsmith-lf.py`). A `run_guards.py --tier ci` over three checkouts therefore refuses
    # with GUARD-SCRIPT-MISSING before running a single guard — so gk-forge and gk-workflow are
    # here because the guard catalog names them, not because this job reads them directly.
    #
    # `KEEPVERSE_WORKSPACE_ROOT` is set rather than left to be found. gk-core's `keepverse_roots`
    # resolves the workspace root by walking up for the directory holding `docs/` and `tasks/`,
    # and on a runner the job workspace holds five SIBLINGS and no `docs/`, so the walk raises and
    # gk-workflow's three guards become unresolvable. The resolver takes the answer as
    # configuration for exactly this reason, and a release must not depend on a walk succeeding.
    env:
      KEEPVERSE_WORKSPACE_ROOT: ${{ github.workspace }}/gk-workflow
    defaults:
      run:
        working-directory: gk-fusion
    steps:
      - uses: actions/checkout@v4
        with:
          path: gk-fusion
          # Release and the reusable CI job inspect the complete tag range, not a shallow tip.
          fetch-depth: 0

      - name: Checkout gk-core (the guard catalog, the IP tool, and the pack publisher)
        uses: actions/checkout@v4
        with:
          repository: keepverse/gk-core
          path: gk-core

      - name: Checkout gk-web (the web gates)
        uses: actions/checkout@v4
        with:
          repository: keepverse/gk-web
          path: gk-web

      - name: Checkout gk-forge (the generators' guards, named by the enforcement registry)
        uses: actions/checkout@v4
        with:
          repository: keepverse/gk-forge
          path: gk-forge

      - name: Checkout gk-workflow (the fail-closed helpers three registry guards name)
        uses: actions/checkout@v4
        with:
          repository: keepverse/gk-workflow
          path: gk-workflow

      # gk-data is PRIVATE and stays private. The generated-seed guard and the guard runner both
      # read it, so an absent token is a named refusal that throws BEFORE any guard runs — the job
      # fails closed rather than passing a subset of its declared coverage while reporting the whole
      # list. This is gk-core/ci.yml's gate, carried unchanged rather than reworded.
      - name: Refuse without the private-content token
        shell: pwsh
        env:
          TOKEN: ${{ secrets.KEEPVERSE_DATA_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TOKEN)) {
            throw ("this release needs secrets.KEEPVERSE_DATA_TOKEN to check out the private gk-data " +
                   "pack. The guard catalog reads gk-data/packs/fusion/data/**. This gate fails closed " +
                   "rather than skipping it.")
          }

      - name: Checkout gk-data (private content pack)
        uses: actions/checkout@v4
        with:
          repository: keepverse/gk-data
          token: ${{ secrets.KEEPVERSE_DATA_TOKEN }}
          path: gk-data

      # The standing refusal for the class of defect the split left in this file, running INSIDE the
      # job whose own references it proves. That placement is the whole point: a checkout this job
      # did not declare is exactly what the check cannot see, so a job that only declares one
      # repository can only prove one repository's worth — which is why this is NOT wired into
      # ci.yml, whose single checkout would let it pass over exactly what it exists to catch.
      #
      # It runs after the checkouts because it resolves against them, and before every other step
      # because every other step is a reference it is here to certify.
      #
      # `--workspace` is the runner's own layout. Locally the same check runs with no argument and
      # resolves the same trees out of this repository's parent, so the answer is the same in both
      # places by construction rather than by luck.
      - name: Workflow path resolution (gk-fusion/scripts/guard-workflow-paths.py)
        shell: pwsh
        run: |
          python scripts/guard-workflow-paths.py --workspace $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "a workflow path does not resolve inside a declared checkout; see the table above" }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # The web app is its own repository since the split, and this job checks out THIS repository
          # only - so `web/fusion-rpg-web` does not exist here. `web/` is absent from every commit on
          # every ref, so this path named a tree this repository has never had, and setup-node with
          # `cache: npm` fails the release on an unresolvable cache-dependency-path before any test
          # runs. The sibling is checked out above; every later reference points at it.
          cache-dependency-path: gk-web/web/fusion-rpg-web/package-lock.json

      - name: Resolve complete release verification range
        id: release-range
        shell: pwsh
        run: |
          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $head = [string]$event.after
          if ([string]::IsNullOrWhiteSpace($head) -or $head -match '^0+$') { $head = $env:GITHUB_SHA }
          if ([string]::IsNullOrWhiteSpace($head) -or $head -match '^0+$') { throw "release cannot resolve the tag SHA" }
          $base = [string]$event.before
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $defaultBranch = [string]$event.repository.default_branch
            if ([string]::IsNullOrWhiteSpace($defaultBranch)) { $defaultBranch = 'main' }
            $base = (git merge-base $head "origin/$defaultBranch").Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($base)) { throw "release cannot resolve an explicit base for $head" }
          }
          $range = "$base..$head"
          "range=$range" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "FUSIONRPG_RELEASE_RANGE=$range" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Release verification range: $range"

      - name: CI superset contract
        shell: pwsh
        run: |
          $ci = Get-Content .github/workflows/ci.yml -Raw
          $release = Get-Content .github/workflows/release.yml -Raw
          if ($ci -notmatch '(?m)^\s{2}workflow_call:\s*$') { throw "CI is not callable as a reusable workflow" }
          if ($release -notmatch '(?m)^\s{4}uses:\s*\./\.github/workflows/ci\.yml\s*$') { throw "Release does not call the reusable CI workflow" }
          if ($release -notmatch '(?m)^\s{4}needs:\s*ci-superset\s*$') { throw "Publish does not depend on the CI superset job" }
          Write-Host "CI superset contract: release invokes the complete reusable CI workflow."

      - name: Release session boundary
        shell: pwsh
        env:
          FUSIONRPG_REVIEW_SESSION: ${{ vars.FUSIONRPG_REVIEW_SESSION }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FUSIONRPG_REVIEW_SESSION)) {
            throw "FUSIONRPG_REVIEW_SESSION is required for a release; a tag cannot publish without a reviewed session fence"
          }
          if ($env:FUSIONRPG_RELEASE_RANGE -notmatch '^(.+)\.\.([^.]+)$') { throw "release range is malformed" }
          $sessionArgs = @('--ci', '--session', $env:FUSIONRPG_REVIEW_SESSION, '--diff-base-ref', $Matches[1], '--diff-head-ref', $Matches[2], '--require-diff-fence')
          # The session-boundary check does not run here. It was invoked as a literal relative path,
          # `python .\scripts\session-boundary-check.py`, which resolves against THIS repository's
          # checkout - and that file has never existed in this repository, because the split left the
          # session records and their checker in the workflow repository at the workspace root (origin
          # keepverse/gk-workflow). A CI runner has exactly one checkout, so the step could only fail.
          #
          # The enforcement registry row is deliberately NOT the bug: it names the script with no repository
          # qualifier and run_guards.py resolves that across all eight workspace roots, which is how
          # 23 gk-core guards, 4 gk-fusion guards and the 2 root-level ones stay addressable. The runner is
          # correct; only the literal path in this workflow was wrong.
          #
          # The check is not lost. It runs in the repository that owns the records, in ci.yml, nightly.yml
          # and release.yml there. Measured 2026-10-02: that copy of the registry had drifted (3 records
          # still `active` where this workspace's copy had them `abandoned`, so the check exited 1 with
          # DRIFT (111)); those 3 are now converged and all three of its workflows exit 0.

      - name: Release generated-seed guard
        # gk-core's scripts. `working-directory` is the repair: the path was `.\scripts\...` from
        # THIS repository's root, where it has never existed. See the job header.
        shell: pwsh
        working-directory: gk-core
        run: |
          python scripts/guard-generated-seed.py --require-explicit-range --range $env:FUSIONRPG_RELEASE_RANGE
          if ($LASTEXITCODE -ne 0) { throw "release generated-seed guard failed" }

      - name: Release guard runner (full CI catalog)
        shell: pwsh
        working-directory: gk-core
        run: |
          python scripts/run_guards.py --tier ci --ci-range $env:FUSIONRPG_RELEASE_RANGE
          if ($LASTEXITCODE -ne 0) { throw "release run_guards.py --tier ci failed" }

      - name: Release web dependency lock
        working-directory: gk-web/web/fusion-rpg-web
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) { throw "web package-lock.json is required for release" }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "release npm ci failed" }

      - name: Unit tests (pre-publish)
        shell: pwsh
        run: |
          # Each call checks its OWN exit code (fixed 2026-09-19). Before that, four `dotnet test`
          # lines ran with no exit check between them, so only the Launcher line decided the step —
          # Core.Tests, Data.Tests or Guard.Tests could fail and the release still published (the
          # same masking defect ci.yml:124-129 documents from a real CI run). `WorkflowExitCheckTests`
          # is the standing guard over both workflows.
          # --blame-hang-timeout aligned 5min -> 10min: ci.yml:117-122 states the value must match
          # test.runsettings' TestTimeout (10min); the release gate was the one place it did not.
          #
          # core-split-wiring E5 (TVB5.7): the release gate lists the Core test projects with the same
          # lines as ci.yml, manifest order with the residual LAST. BalanceGuard lines stay in ci.yml
          # only (W6's filter set is a ci.yml contract); this gate runs each project unfiltered.
            # gk-core's test matrix is GONE from this file, and it was never this repository's.
            # Measured: this step ran 71 `dotnet test` calls, of which exactly ONE resolved against
            # gk-fusion. The other 70 named tests/FusionRpg.Core.*, tests/FusionRpg.Data.Tests and
            # tests/FusionRpg.Guard.Tests - all gk-core projects that do not exist here - so no
            # release since the split could have passed this step. It is the pre-split monorepo's
            # release gate, placed here by the split; a gate that cannot pass is worse than no gate,
            # because it looks like coverage.
            #
            # CI policy is gk-workflow's, and a test matrix belongs to the repository that owns the
            # projects, so this repository gates the ONE project it owns that a public runner can
            # execute: FusionRpg.Launcher.Tests (166 tests, green, no interop needed).
            # FusionRpg.Injector.Tests is deliberately absent - it compiles against the BepInEx and
            # MelonLoader interop assemblies of a real game install and does not build without them
            # (measured), so saying so is better than omitting it silently.
            #
            # Each call checks its OWN exit code. Before 2026-09-19 four `dotnet test` lines ran with
            # no exit check between them, so only the last one decided the step and a failure in any
            # earlier project still published the release.
          dotnet test tests/FusionRpg.Launcher.Tests/FusionRpg.Launcher.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Launcher.Tests failed" }

      # ip-censor T12 (owner ruling IC-3): the IP release gate. The scan is ADVISORY in CI (T11,
      # ci.yml) and BLOCKING here — the release is the only thing a finding stops. It sits after the
      # unit tests and before `Publish player pack`, so a mark that reached player-facing text fails
      # the release instead of shipping.
      #
      # The scan runs from the REPOSITORY ROOT on purpose: `report` resolves the scanned tree from
      # `git rev-parse --show-toplevel`, so a `working-directory: gk-core/tools/ip-censor` would enumerate
      # only the tool and the gate would pass vacuously (plan D4, audit 2026-09-19). The installs
      # name the tool explicitly for the same reason — one step, one working directory.
      #
      # `--authored-only` is what makes the gate deterministic and offline, as spec-report.md
      # §Success criteria requires ("the gate needs no model and no network by construction").
      # Without it `scan` builds the LLM proposer and waits on the endpoint named by IPCENSOR_LLM_*
      # once per mark that has no authored replacement pair — minutes of block on any machine where a
      # local model endpoint is listening, for a decision the gate does not make.
      # The tool is gk-core's (`tools/ip-censor`), so the INSTALL runs from gk-core. The SCAN runs from
      # THIS repository's root, which is a different directory on purpose — see the comment above on
      # `report` resolving the scanned tree, and note that after the split this repository's root is
      # `gk-fusion/` rather than the workspace root. The boundary is worth stating: this gate covers
      # gk-fusion's authored text, and gk-core's authored text is covered by gk-core's own advisory
      # scan on every push, which is the division owner ruling IC-3 drew.
      - name: IP release gate install (ip-censor, IC-3)
        shell: pwsh
        working-directory: gk-core
        run: |
          python -m pip install -r tools/ip-censor/requirements.lock
          if ($LASTEXITCODE -ne 0) { throw "ip-censor lockfile install failed" }
          python -m pip install -e tools/ip-censor --no-deps
          if ($LASTEXITCODE -ne 0) { throw "ip-censor editable install failed" }

      - name: IP release gate (ip-censor, IC-3)
        shell: pwsh
        run: |
          # The directory is created here because it does not exist in a fresh checkout: this
          # repository has no `tasks/` tree at all. That made this step SILENT rather than red, and
          # silent is the worse of the two failures — measured in gk-core/ci.yml, which carries the
          # measurement: a pwsh redirect to a path whose parent is missing raises "Could not find a
          # part of the path", does NOT run the command, and leaves $LASTEXITCODE at 0. So the
          # `throw` below never fired, no artifact was written, and the release's ONLY blocking IP
          # gate reported success having run no scan at all.
          New-Item -ItemType Directory -Force -Path tasks/ip-censor | Out-Null
          python -m ipcensor.report scan --format json --fail-on enforced --authored-only > tasks/ip-censor/release-scan.json
          if ($LASTEXITCODE -ne 0) { throw "ip-censor release gate: an enforced IP finding blocks this release (see the findings step below)" }
          # The exit code above does not prove the redirect wrote anything; assert the artifact.
          if (-not (Test-Path tasks/ip-censor/release-scan.json)) { throw "ip-censor's release scan wrote no artifact - the redirect failed, and $LASTEXITCODE does not report that" }

      # Says WHAT the gate found, since the scan itself is redirected to a file. It runs only when
      # an earlier step failed, and only prints when the gate actually produced a plan.
      - name: IP release gate findings (ip-censor, IC-3)
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path tasks/ip-censor/release-scan.json)) { exit 0 }
          $plan = Get-Content tasks/ip-censor/release-scan.json -Raw | ConvertFrom-Json
          $blocking = @(
            $plan.groups.PSObject.Properties.Value |
              Where-Object { $_.bucket -in @('player-name', 'player-prose', 'generator-prompt') })
          $blocking | ForEach-Object { Write-Host "  BLOCKING $($_.path):$($_.line)  $($_.matched) [$($_.mark)] $($_.bucket)" }
          Write-Host "ip-censor: $($blocking.Count) enforced finding(s) across $((@($blocking.path | Sort-Object -Unique)).Count) file(s)"

      - name: Prepare injector refs
        shell: pwsh
        # gk-core's script, and gk-fusion is its pack root: the tool writes its reference tree to
        # `<root>/artifacts/bepinex-refs` and `publish_player.py` reads the SAME path under ITS
        # root, so `--root` has to name one directory for both or the prepare step prepares refs
        # the publish step cannot see. That is the whole reason for naming it explicitly instead of
        # letting the tool default to the repository it lives in.
        working-directory: gk-core
        env:
          FUSIONRPG_GAME_DIR: ${{ vars.FUSIONRPG_GAME_DIR }}
          FUSIONRPG_INTEROP_ZIP_URL: ${{ secrets.FUSIONRPG_INTEROP_ZIP_URL }}
        run: |
          # THIRD SPELLING, NOW ONE. This line said `./scripts/prepare-injector-refs.ps1`: the
          # PowerShell name for a script that was ported to `prepare_injector_refs.py`, run as
          # `./` from a directory that never held it. A rename that leaves the caller naming the
          # old file is the same defect as a forked lock file, and it is invisible to a reader
          # because the file it names looks like a plausible path.
          #
          # The fallback is on the EXIT CODE, not in a `catch`. Under GitHub's `shell: pwsh` a
          # native command that exits non-zero does NOT raise — `$LASTEXITCODE` is a side effect,
          # not an exception — so the `try`/`catch` this replaced could never have fired for the
          # one failure it exists to handle. On a runner with no game interop the tool refuses by
          # design, which is exactly the case the CI-drop fallback exists for, and the step would
          # have failed instead of falling back. Branching on `$LASTEXITCODE` is what makes the
          # fallback reachable at all.
          python scripts/prepare_injector_refs.py --root ../gk-fusion
          if ($LASTEXITCODE -eq 0) {
            "FUSIONRPG_GAME_DIR=$env:FUSIONRPG_GAME_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }
          $ciDrop = "../gk-fusion/artifacts/ci-drop-into-game/FusionRpg.Injector.dll"
          if (Test-Path $ciDrop) {
            Write-Host "::warning::No game interop in CI — using committed artifacts/ci-drop-into-game (set secrets.FUSIONRPG_INTEROP_ZIP_URL to rebuild injector from source)."
            "FUSIONRPG_USE_CI_DROP=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          else {
            Write-Host "::error::Cloud release needs secrets.FUSIONRPG_INTEROP_ZIP_URL (or vars.FUSIONRPG_GAME_DIR) or committed artifacts/ci-drop-into-game."
            throw "prepare_injector_refs.py refused and there is no committed CI drop to fall back on"
          }

      - name: Publish player pack
        shell: pwsh
        # gk-core's script; gk-fusion is the pack root, for the reason given in the step above.
        working-directory: gk-core
        env:
          FUSIONRPG_VERSION: ${{ github.ref_name }}
        run: python scripts/publish_player.py --root ../gk-fusion

      - name: Smoke player pack
        shell: pwsh
        working-directory: gk-core
        run: python scripts/smoke_player_pack.py --pack-dir ../gk-fusion/dist/FusionRpg

      # The Zip step below reads `dist/FusionRpg` and `artifacts/` relative to the JOB's working
      # directory, which is `gk-fusion/` (the job default) — the same pack root the publish step
      # wrote to. Named explicitly so that is a decision on the line rather than a coincidence of
      # two defaults, and because the Zip step's `New-Item artifacts` is what creates the directory
      # the publish step's `artifacts/ci-drop-into-game` fallback tested for.
      - name: Zip FusionRpg-win-x64.zip
        shell: pwsh
        working-directory: gk-fusion
        run: |
          $src = "dist/FusionRpg"
          if (-not (Test-Path $src)) { throw "Missing $src" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $zip = "artifacts/FusionRpg-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $zip -Force
          Get-Item $zip | Format-List Name, Length

          # Builds are unsigned, so a published hash is the only way anyone can check that what
          # they downloaded is what CI produced. Emitted as a file and into the release notes.
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  FusionRpg-win-x64.zip" | Set-Content "artifacts/FusionRpg-win-x64.zip.sha256" -NoNewline
          Write-Host "SHA256 $sha"
          "PACK_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append

          if (Test-Path "artifacts/player-pack-smoke.json") {
            Write-Host "Smoke summary:"
            Get-Content "artifacts/player-pack-smoke.json"
          }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/FusionRpg-win-x64.zip
            artifacts/FusionRpg-win-x64.zip.sha256
          generate_release_notes: true
          body: |
            ## FusionRpg ${{ github.ref_name }}

            **Asset:** `FusionRpg-win-x64.zip` — **right-click the zip → Properties → Unblock** before
            extracting, then double-click `FusionRpg.Launcher.exe`.

            Windows marks downloaded files, and antivirus judges marked files far more harshly —
            unblocking the zip first is the simplest way to avoid a false-positive quarantine.

            `SHA256` — verify with `Get-FileHash FusionRpg-win-x64.zip`:

            ```
            ${{ env.PACK_SHA256 }}
            ```

            - Builds are **unsigned hobby OSS** — see Trust & security in the launcher / [players.md](https://github.com/letuhao/plant-vs-zombie-rise-of-summoner/blob/main/docs/runbook/players.md#trust--antivirus-unsigned-hobby-builds).
            - Licensed **AGPL-3.0-or-later** (see `LICENSE` in the zip).
            - Updates **FusionRpg only** (launcher + Server + DropIntoGame). Does **not** download or patch the PVZ Fusion game.
            - Needs a legal game install. Use **Browse** then **Install BepInEx** from official GitHub if needed.
            - Dual-loading BepInEx + MelonLoader is refused. MelonMod dual-host Play is not in this release.

            Player guide: [docs/runbook/players.md](https://github.com/letuhao/plant-vs-zombie-rise-of-summoner/blob/main/docs/runbook/players.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
