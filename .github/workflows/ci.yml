name: CI

# gk-fusion's own continuous integration.
#
# WHY THIS FILE IS SMALL AND WHY IT IS HERE AT ALL. CI policy is gk-workflow's, per the workspace
# ownership rule: shared guards, verification harnesses, path rules and contributor standards have
# one owner, and a second copy in a sub-repository is the competing copy that rule exists to
# prevent. This repository therefore holds a THIN ENTRYPOINT, not a policy of its own - it names
# this repository's own test projects and nothing else. The one place it earns its keep is that
# release.yml calls it as a reusable workflow, which means the file has to exist here for a tag to
# publish at all. It did not: release.yml referenced ./.github/workflows/ci.yml, so the
# ci-superset job failed on a missing file before any test ran.

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml as a reusable workflow at the tag's exact checked-out commit. A release
  # is meant to be a declared superset of CI, not a second hand-maintained partial test list -
  # which is why release.yml delegates here instead of repeating these commands.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native tests (Launcher)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      # The SOLUTION, not a hand-maintained list of projects - and that is the point of this step
      # rather than a convenience. Measured at this commit: `dotnet test FusionRpg.slnx` runs 230
      # tests across three projects (LawnCombatObserver 4, Launcher 166, ProveLiveProbe 60), all
      # passing, with no game install and no interop assemblies. Before the solution named those
      # projects, `dotnet test` at this repository's root reported 166 passing tests and said
      # NOTHING about the other two - which reads as coverage rather than as omission, because an
      # unbuildable project is reported as absent rather than as an error.
      #
      # Naming the solution means a project that drops OUT of it stops this gate rather than
      # vanishing from it. A list of paths has the opposite failure: delete a line and the tests
      # quietly stop running, with the gate still green.
      #
      # tests/FusionRpg.Injector.Tests is NOT in the solution and must not be added blind. It was
      # measured: build exit 1 even with the interop cells set, because it compiles against a real
      # game install's BepInEx and MelonLoader interop assemblies. Adding it would fail the whole
      # solution build, which trades two invisible projects for an unusable repository. Its absence
      # is a measured exclusion, not an oversight, and the reason lives in FusionRpg.slnx's history.
      #
      # --blame-hang-timeout matches test.runsettings' TestTimeout; a runner's own default is far
      # longer, and ProveLiveProbe spawns processes that can wait.
      # A solution-level BUILD first, so a project that does not compile fails here with a compile
      # error rather than as a confusing test failure later. It is also the only step covering the
      # four loader hosts, which no test project references.
      - name: Build the solution
        run: dotnet build FusionRpg.slnx -v minimal --nologo

      - name: Run the tests
        run: dotnet test FusionRpg.slnx --no-build --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Launcher.Tests failed" }
